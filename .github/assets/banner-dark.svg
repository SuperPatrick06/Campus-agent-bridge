<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#121a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 112) rotate(90) scale(215 540)">
      <stop stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="1280" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
  </g>

  <!-- logo mark: a bridge -->
  <g transform="translate(592 26)">
    <rect width="96" height="96" rx="26" fill="url(#accent)"/>
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 62 H 78"/>
      <path d="M 33 32 V 64"/>
      <path d="M 63 32 V 64"/>
      <path d="M 33 32 Q 48 54 63 32"/>
      <path d="M 33 32 Q 25 38 18 48"/>
      <path d="M 63 32 Q 71 38 78 48"/>
      <path d="M 40.5 40.5 V 62"/>
      <path d="M 48 43 V 62"/>
      <path d="M 55.5 40.5 V 62"/>
    </g>
    <circle cx="18" cy="62" r="4.5" fill="#ffffff"/>
    <circle cx="78" cy="62" r="4.5" fill="#ffffff"/>
  </g>

  <text x="640" y="198" text-anchor="middle"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-0.5" fill="#f1f5f9">campus-agent-bridge</text>

  <rect x="550" y="218" width="180" height="7" rx="3.5" fill="url(#accent)"/>

  <text x="640" y="272" text-anchor="middle"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="5.5" fill="#64748b">ZERO DEPS &#183; LOCAL-ONLY &#183; OPEN SOURCE</text>
</svg>
