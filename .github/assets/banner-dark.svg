<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 260) rotate(90) scale(230 560)">
      <stop stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
  </g>

  <text x="640" y="118" text-anchor="middle"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-1" fill="#f1f5f9">campus-agent-bridge</text>
  <rect x="510" y="142" width="260" height="8" rx="4" fill="url(#accent)"/>

  <!-- bridge scene -->
  <g stroke="#e2e8f0" stroke-linecap="round">
    <path d="M 238 249 H 1042" stroke-width="5"/>
    <path d="M 430 249 V 170" stroke-width="5"/>
    <path d="M 850 249 V 170" stroke-width="5"/>
    <path d="M 430 170 Q 640 268 850 170" stroke-width="4" fill="none" opacity="0.9"/>
    <path d="M 430 170 Q 320 196 238 249" stroke-width="4" fill="none" opacity="0.9"/>
    <path d="M 850 170 Q 960 196 1042 249" stroke-width="4" fill="none" opacity="0.9"/>
    <g stroke-width="3" opacity="0.75">
      <path d="M 472 188 V 249"/>
      <path d="M 514 201 V 249"/>
      <path d="M 598 217 V 249"/>
      <path d="M 682 217 V 249"/>
      <path d="M 766 201 V 249"/>
      <path d="M 808 188 V 249"/>
    </g>
  </g>

  <circle cx="330" cy="249" r="8" fill="url(#accent)"/>
  <circle cx="640" cy="249" r="8" fill="url(#accent)"/>
  <circle cx="950" cy="249" r="8" fill="url(#accent)"/>

  <!-- Codex endpoint -->
  <g transform="translate(150 205)">
    <rect width="88" height="88" rx="24" fill="#101725" stroke="url(#accent)" stroke-width="2.5"/>
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 32 L 42 44 L 28 56"/>
      <path d="M 50 58 H 64"/>
    </g>
  </g>

  <!-- Gateway endpoint -->
  <g transform="translate(1042 205)">
    <rect width="88" height="88" rx="24" fill="#101725" stroke="url(#accent)" stroke-width="2.5"/>
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <rect x="27" y="27" width="34" height="34" rx="8"/>
      <circle cx="44" cy="44" r="5.5" fill="#ffffff" stroke="none"/>
      <path d="M 36 17 V 27"/><path d="M 52 17 V 27"/>
      <path d="M 36 61 V 71"/><path d="M 52 61 V 71"/>
      <path d="M 17 36 H 27"/><path d="M 17 52 H 27"/>
      <path d="M 61 36 H 71"/><path d="M 61 52 H 71"/>
    </g>
  </g>

  <text x="194" y="332" text-anchor="middle"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="600" letter-spacing="4.5" fill="#64748b">CODEX</text>
  <text x="1086" y="332" text-anchor="middle"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="600" letter-spacing="4.5" fill="#64748b">YOUR GATEWAY</text>

  <path d="M 500 374 H 780" stroke="#1e293b" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 570 398 H 710" stroke="#1e293b" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
