<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="headA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <style>
      .t  { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .m  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- left card: Codex -->
  <rect x="16" y="76" width="196" height="116" rx="18" fill="#101725" stroke="#334155" stroke-width="1.5"/>
  <text class="t" x="114" y="128" text-anchor="middle" font-size="23" font-weight="700" fill="#f1f5f9">Codex</text>
  <text class="t" x="114" y="158" text-anchor="middle" font-size="15" font-weight="500" fill="#94a3b8">agent + tools</text>

  <!-- middle card: bridge proxy -->
  <rect x="316" y="52" width="248" height="164" rx="20" fill="#0d1526" stroke="url(#accent)" stroke-width="2.5"/>
  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 402 118 H 478"/>
    <path d="M 418 118 V 84"/>
    <path d="M 462 118 V 84"/>
    <path d="M 418 84 Q 440 112 462 84"/>
    <path d="M 418 84 Q 410 92 402 108"/>
    <path d="M 462 84 Q 470 92 478 108"/>
    <path d="M 429 94.5 V 118"/>
    <path d="M 440 98 V 118"/>
    <path d="M 451 94.5 V 118"/>
  </g>
  <circle cx="402" cy="118" r="3.5" fill="url(#accent)"/>
  <circle cx="478" cy="118" r="3.5" fill="url(#accent)"/>
  <text class="t" x="440" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">campus-agent-bridge</text>
  <text class="m" x="440" y="178" text-anchor="middle" font-size="15" fill="#60a5fa">127.0.0.1:8787</text>

  <!-- right card: gateway -->
  <rect x="668" y="76" width="196" height="116" rx="18" fill="#101725" stroke="#334155" stroke-width="1.5"/>
  <text class="t" x="766" y="128" text-anchor="middle" font-size="23" font-weight="700" fill="#f1f5f9">Gateway</text>
  <text class="t" x="766" y="158" text-anchor="middle" font-size="15" font-weight="500" fill="#94a3b8">the brain</text>

  <!-- gap 1: codex <-> proxy -->
  <path d="M 226 112 H 300" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#headA)"/>
  <path d="M 302 142 H 228" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#head)"/>
  <text class="t" x="264" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#94a3b8">Responses API</text>
  <text class="t" x="264" y="170" text-anchor="middle" font-size="15" font-weight="500" fill="#64748b">Codex dialect</text>

  <!-- gap 2: proxy <-> gateway -->
  <path d="M 578 112 H 652" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#headA)"/>
  <path d="M 654 142 H 580" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#head)"/>
  <text class="t" x="616" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#94a3b8">strict subset</text>
  <text class="t" x="616" y="170" text-anchor="middle" font-size="15" font-weight="500" fill="#64748b">clean dialect</text>

  <!-- footnotes -->
  <text class="t" x="114" y="234" text-anchor="middle" font-size="15" font-weight="500" fill="#64748b">tools run locally</text>
  <text class="t" x="766" y="234" text-anchor="middle" font-size="15" font-weight="500" fill="#64748b">your institution's API</text>
</svg>
